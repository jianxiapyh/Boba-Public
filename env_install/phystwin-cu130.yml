name: phystwin-cu130
channels:
  - nvidia
  - defaults
dependencies:
  - python=3.10.20
  - pip=26.1.2
  - cuda-toolkit=13.0.0
  - cuda-compiler=13.0.0
  - gcc_linux-64=14.3.0
  - gxx_linux-64=14.3.0
  - libgl-devel=1.7.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.10.0+cu130
      - torchvision==0.25.0+cu130
      - torchaudio==2.10.0+cu130
      - numpy==1.26.4
      - scipy==1.15.3
      - PyYAML==6.0.3
      - pillow==12.2.0
      - matplotlib==3.10.8
      - opencv-python==4.11.0.86
      - termcolor==3.3.0
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - warp-lang==1.12.1
      - open3d==0.19.0
      - glfw==2.10.0
      - PyOpenGL==3.1.0
      - pycuda==2026.1
      - ninja==1.13.0
      - kornia==0.8.2
      - plyfile==1.1.3
      - pyrender==0.1.45
      - trimesh==4.11.5
      - jaxtyping==0.3.7
      - rich==15.0.0
variables:
  PYTHONNOUSERSITE: "1"

# Prefix-dependent paths are derived from CONDA_PREFIX by the extension build.
# After creating and activating this environment, run:
#   ./env_install/build_cuda13_extensions.sh
